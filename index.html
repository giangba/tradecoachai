<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeCoach AI – Nhật ký giao dịch</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#131722;--card:#1e222d;--line:#2a2e39;--tx:#d1d4dc;--mut:#787b86;--up:#26a69a;--dn:#ef5350;--warn:#f0b90b;--acc:#2962ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);gap:8px}
h1{font-size:16px;margin:0}h1 b{color:var(--acc)}h2{font-size:15px;margin:0 0 10px}
nav{display:flex;gap:4px;padding:8px 16px;overflow-x:auto}
nav button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap}
nav button.on{background:var(--acc);color:#fff}
main{padding:0 16px 40px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:26px}
.up{color:var(--up)}.dn{color:var(--dn)}.wn{color:var(--warn)}
label{display:block;color:var(--mut);font-size:12px;margin:8px 0 3px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:8px;border-radius:6px;font:inherit}
textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
button.pri{background:var(--acc);color:#fff;border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:600;margin-top:12px}
button.pri:disabled{opacity:.5}button.sec{background:var(--line);color:var(--tx);border:0;padding:8px 12px;border-radius:6px;cursor:pointer}
.alert{border-radius:8px;padding:12px 14px;margin:12px 0;border:2px solid;font-weight:500}
.alert.green{background:#26a69a22;border-color:var(--up)}.alert.red{background:#ef535026;border-color:var(--dn)}.alert.yellow{background:#f0b90b1f;border-color:var(--warn)}
.alert h3{margin:0 0 4px;font-size:16px}.alert ul{margin:6px 0 0;padding-left:18px;font-weight:400}
.trade{border-left:4px solid var(--line)}.trade.green{border-color:var(--up)}.trade.red{border-color:var(--dn)}.trade.yellow{border-color:var(--warn)}
.mut{color:var(--mut)}.hide{display:none}.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--dn)}
.overflow{overflow-x:auto}.imgs img{max-width:48%;border-radius:6px;border:1px solid var(--line);margin:4px 1% 0 0}
.chip{background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:6px 12px;border-radius:16px;cursor:pointer;margin:0 6px 6px 0;font:inherit}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
table th,table td{padding:6px 8px}
#auth{max-width:380px;margin:60px auto}
</style></head><body>
<header><h1>📈 Trade<b>Coach</b> AI</h1><span><span class="mut" id="who"></span> <button class="sec hide" id="out">Đăng xuất</button></span></header>
<main id="auth" class="hide"><div class="card"><h2>Đăng nhập / Đăng ký</h2>
<label>Email</label><input id="a-mail" type="email"><label>Mật khẩu (≥6 ký tự)</label><input id="a-pw" type="password">
<button class="pri" id="a-in">Đăng nhập</button> <button class="sec" id="a-up">Đăng ký</button><p id="a-msg" class="mut"></p></div></main>
<div id="app" class="hide"><nav id="nav"></nav><main>
<section id="p-dash"></section><section id="p-rules" class="hide"></section><section id="p-new" class="hide"></section><section id="p-log" class="hide"></section><section id="p-ana" class="hide"></section><section id="p-bt" class="hide"></section></main></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tIds=t=>t.setup_ids?.length?t.setup_ids:(t.setup_id?[t.setup_id]:[]);
let selS=null,fSetup="",editId=null,tok,sb,S={setups:[],trades:[]},uid,tab="dash",busy=false;
const tabs={dash:"Dashboard",rules:"Setup chuẩn",new:"+ Lệnh mới",log:"Nhật ký",ana:"Phân tích",bt:"Backtest"};
$("#nav").innerHTML=Object.entries(tabs).map(([k,v])=>`<button data-k="${k}">${v}</button>`).join("");
$("#nav").onclick=e=>{if(e.target.dataset.k)show(e.target.dataset.k)};
function show(k){tab=k;for(const t in tabs)$("#p-"+t).classList.toggle("hide",t!==k);
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));render()}
async function token(){return tok||(await sb.auth.getSession()).data.session?.access_token}
async function api(body){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),100000);
 try{const r=await fetch("/api/analyze",{method:"POST",signal:ac.signal,headers:{"content-type":"application/json",Authorization:"Bearer "+await token()},body:JSON.stringify(body)});
 const raw=await r.text();let j;try{j=JSON.parse(raw)}catch(e){throw new Error("Server trả lỗi "+r.status+": "+raw.slice(0,120))}
 if(!r.ok)throw new Error(j.error||"Lỗi server "+r.status);return j}
 catch(e){throw new Error(e.name==="AbortError"?"Quá thời gian chờ (100s). Thử lại hoặc dùng ảnh nhỏ hơn.":e.message)}finally{clearTimeout(tm)}}
function compress(file){return new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error("Không đọc được ảnh (thử PNG/JPG)")),15000);
 const im=new Image();im.onload=()=>{try{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");
 c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
 c.toBlob(bl=>{if(!bl){clearTimeout(t);return no(new Error("Không nén được ảnh"))}const f=new FileReader();
 f.onload=()=>{clearTimeout(t);ok({blob:bl,media_type:"image/jpeg",data:f.result.split(",")[1]})};f.onerror=()=>no(new Error("Lỗi đọc ảnh"));f.readAsDataURL(bl)},"image/jpeg",.82)}catch(e){clearTimeout(t);no(e)}};
 im.onerror=()=>{clearTimeout(t);no(new Error("Định dạng ảnh không được hỗ trợ. Hãy dùng PNG/JPG"))};im.src=URL.createObjectURL(file)})}
async function boot(){
 const c=await (await fetch("/api/config")).json();sb=supabase.createClient(c.url,c.key);
 sb.auth.onAuthStateChange((_e,s)=>{setTimeout(()=>enter(s),0)});enter((await sb.auth.getSession()).data.session)}
async function enter(s){tok=s?.access_token;const on=!!s;$("#auth").classList.toggle("hide",on);$("#app").classList.toggle("hide",!on);$("#out").classList.toggle("hide",!on);
 if(!on){uid=null;$("#who").textContent="";return}
 if(uid===s.user.id)return;uid=s.user.id;$("#who").textContent=s.user.email;
 const r=await sb.from("setups").select("*").order("created_at");S.setups=r.data||[];editId=null;selS=null;
 const t=await sb.from("trades").select("*").order("created_at");S.trades=t.data||[];
 delete $("#p-new").dataset.r;show("dash")}
$("#a-in").onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$("#a-mail").value,password:$("#a-pw").value});if(r.error)$("#a-msg").textContent=r.error.message};
$("#a-up").onclick=async()=>{const r=await sb.auth.signUp({email:$("#a-mail").value,password:$("#a-pw").value});$("#a-msg").textContent=r.error?r.error.message:(r.data.session?"":"Kiểm tra email để xác nhận tài khoản.")};
$("#out").onclick=()=>sb.auth.signOut();
function stats(){const t=S.trades.filter(x=>!fSetup||tIds(x).map(String).includes(fSetup)),done=t.filter(x=>x.result==="win"||x.result==="loss"),w=done.filter(x=>x.result==="win").length;
 const sc=t.filter(x=>x.ai&&typeof x.ai.score==="number"),avg=sc.length?Math.round(sc.reduce((a,x)=>a+x.ai.score,0)/sc.length):null;
 const comp=sc.filter(x=>x.ai.verdict==="green").length,tags={};t.forEach(x=>(x.ai?.violations||[]).forEach(v=>{const k=v.slice(0,60);tags[k]=(tags[k]||0)+1}));
 return{n:t.length,wr:done.length?Math.round(w/done.length*100):null,avg,comp:sc.length?Math.round(comp/sc.length*100):null,sc,tags}}
function chart(sc){if(sc.length<2)return'<p class="mut">Cần ít nhất 2 lệnh đã phân tích để vẽ biểu đồ.</p>';
 const W=640,H=160,p=24,pts=sc.map((x,i)=>[p+i*(W-2*p)/(sc.length-1),H-p-(x.ai.score/100)*(H-2*p),x.ai.verdict]),col={green:"#26a69a",red:"#ef5350",yellow:"#f0b90b"};
 return`<div class="overflow"><svg viewBox="0 0 ${W} ${H}" style="min-width:420px;width:100%">${[0,50,100].map(v=>{const y=H-p-v/100*(H-2*p);return`<line x1="${p}" x2="${W-p}" y1="${y}" y2="${y}" stroke="#2a2e39"/><text x="0" y="${y+4}" fill="#787b86" font-size="10">${v}</text>`}).join("")}
 <polyline fill="none" stroke="#2962ff" stroke-width="2" points="${pts.map(a=>a[0]+","+a[1]).join(" ")}"/>${pts.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="5" fill="${col[a[2]]||"#888"}"/>`).join("")}</svg></div>`}
function alertHTML(a){if(!a)return'<div class="alert yellow">Chưa có phân tích AI.</div>';
 const m={green:["✅ TUÂN THỦ SETUP","green"],red:["🚨 CẢNH BÁO ĐỎ – VI PHẠM KỶ LUẬT","red"],yellow:["⚠️ CẦN LƯU Ý","yellow"]}[a.verdict]||["⚠️ CẦN LƯU Ý","yellow"];
 return`<div class="alert ${m[1]}"><h3>${m[0]} · ${esc(a.score)}/100${a.fomo?" · FOMO":""}</h3>${esc(a.summary)}${a.provider&&a.provider!=="gemini"?`<div class="mut" style="font-size:11px;font-weight:400">🔁 Phân tích bởi model dự phòng (${esc(a.provider)})</div>`:""}${a.per_setup?.length>1?`<div style="font-weight:400;margin-top:8px">${a.per_setup.map(p=>`<div>${{green:"✅",red:"🚨",yellow:"⚠️"}[p.verdict]||"•"} <b>${esc(p.name)}</b> · ${esc(p.score)}/100 – ${esc(p.summary)}</div>`).join("")}</div>`:""}${a.violations?.length?`<ul>${a.violations.map(v=>`<li>${esc(v)}</li>`).join("")}</ul>`:""}</div>`}
function setupTable(){if(S.setups.length<2)return"";
 const rows=S.setups.map(s=>{const t=S.trades.filter(x=>tIds(x).includes(s.id)),d=t.filter(x=>x.result==="win"||x.result==="loss"),w=d.filter(x=>x.result==="win").length,sc=t.filter(x=>x.ai&&typeof x.ai.score==="number");
  return`<tr><td>${esc(s.name)}</td><td>${t.length}</td><td>${d.length?Math.round(w/d.length*100)+"%":"–"}</td><td>${sc.length?Math.round(sc.reduce((a,x)=>a+x.ai.score,0)/sc.length):"–"}</td></tr>`}).join("");
 return`<div class="card overflow"><h2>So sánh các setup</h2><table style="width:100%;border-collapse:collapse;text-align:left"><tr class="mut"><th>Setup</th><th>Số lệnh</th><th>Win-rate</th><th>Kỷ luật TB</th></tr>${rows}</table></div>`}
function render(){
 if(tab==="dash"){const s=stats();$("#p-dash").innerHTML=`${S.setups.length?`<select id="d-setup" style="max-width:260px;margin-bottom:12px"><option value="">Tất cả setup</option>${S.setups.map(x=>`<option value="${x.id}" ${String(x.id)===fSetup?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`:""}<div class="grid" style="margin-bottom:14px">
  <div class="card kpi"><small>Tổng số lệnh</small><b>${s.n}</b></div>
  <div class="card kpi"><small>Win-rate</small><b class="${s.wr>=50?"up":"dn"}">${s.wr??"–"}${s.wr!=null?"%":""}</b></div>
  <div class="card kpi"><small>Discipline Score TB</small><b class="${s.avg>=70?"up":s.avg>=40?"wn":"dn"}">${s.avg??"–"}</b></div>
  <div class="card kpi"><small>Lệnh tuân thủ</small><b class="up">${s.comp??"–"}${s.comp!=null?"%":""}</b></div></div>
  <div class="card"><h2>Discipline Score theo thời gian</h2>${chart(s.sc)}</div>
  ${fSetup?"":setupTable()}<div class="card"><h2>Lỗi thường gặp</h2>${Object.keys(s.tags).length?Object.entries(s.tags).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>`<div style="margin:8px 0">${esc(k)} <span class="mut">×${v}</span><div class="bar"><i style="width:${v/Math.max(...Object.values(s.tags))*100}%"></i></div></div>`).join(""):'<p class="mut">Chưa có vi phạm nào.</p>'}</div>`;
  const f=$("#d-setup");if(f)f.onchange=()=>{fSetup=f.value;render()}}
 if(tab==="rules")renderRules();
 if(tab==="ana")renderAna();
 if(tab==="bt")renderBT();
 if(tab==="new"&&!$("#p-new").dataset.r){$("#p-new").dataset.r=1;
  $("#p-new").innerHTML=`<div class="card"><h2>Thêm lệnh mới</h2><div class="row"><div><label>Cặp tiền</label><input id="n-pair" placeholder="EURUSD"></div>
  <div><label>Hướng</label><select id="n-side"><option>BUY</option><option>SELL</option></select></div><div><label>Entry</label><input id="n-e" type="number" step="any"></div>
  <div><label>SL</label><input id="n-sl" type="number" step="any"></div><div><label>TP</label><input id="n-tp" type="number" step="any"></div></div>
  <div class="row"><div><label>Ảnh chart H4</label><input type="file" id="n-h4" accept="image/*"></div><div><label>Ảnh chart M15</label><input type="file" id="n-m15" accept="image/*"></div></div>
  <label>Setup đối chiếu (chọn một hoặc nhiều)</label><div id="n-setups"></div><label>Ghi chú lý do vào lệnh</label><textarea id="n-note" placeholder="Vì sao bạn vào lệnh này?"></textarea>
  <button class="pri" id="n-save">Lưu lệnh & nhờ AI kiểm tra kỷ luật</button><div id="n-out"></div></div>`;$("#n-save").onclick=addTrade}
 if(tab==="new"){if(!selS)selS=new Set(S.setups.length?[String(S.setups[0].id)]:[]);
  $("#n-setups").innerHTML=S.setups.length?S.setups.map(x=>`<label style="display:flex;gap:8px;align-items:center;color:var(--tx);font-size:14px;margin:4px 0"><input type="checkbox" style="width:auto" value="${x.id}" ${selS.has(String(x.id))?"checked":""}>${esc(x.name)}</label>`).join(""):'<p class="mut">Chưa có setup – hãy tạo ở tab "Setup chuẩn".</p>';
  $("#n-setups").onchange=e=>{e.target.checked?selS.add(e.target.value):selS.delete(e.target.value)}}
 if(tab==="log"){$("#p-log").innerHTML=S.trades.length?[...S.trades].reverse().map(t=>{const rr=rrOf(t);
  return`<div class="card trade ${t.ai?.verdict||""}"><b>${esc(t.pair)} · ${esc(t.side)}</b> ${tIds(t).map(id=>S.setups.find(x=>x.id===id)).filter(Boolean).map(s=>`<span class="chip on" style="padding:1px 9px;font-size:12px;cursor:default">${esc(s.name)}</span>`).join("")} <span class="mut">${new Date(t.created_at).toLocaleString("vi-VN")}</span>
  <div class="mut">Entry ${esc(t.entry)} · SL ${esc(t.sl)} · TP ${esc(t.tp)} · RR ${rr==null?"–":rr.toFixed(2)}</div><p>${esc(t.note)}</p>
  <div class="imgs">${[t.h4_path,t.m15_path].filter(Boolean).map(p=>`<img data-p="${esc(p)}" alt="chart">`).join("")}</div>${alertHTML(t.ai)}
  <label>Kết quả</label><select data-id="${t.id}" class="res" style="max-width:160px">${[["open","Đang mở"],["win","Thắng"],["loss","Thua"]].map(([v,l])=>`<option value="${v}" ${t.result===v?"selected":""}>${l}</option>`).join("")}</select> <button class="sec del" data-id="${t.id}" style="margin-left:8px">🗑 Xoá lệnh</button></div>`}).join(""):'<div class="card mut">Chưa có lệnh nào.</div>';
  document.querySelectorAll(".res").forEach(s=>s.onchange=async()=>{S.trades.find(t=>t.id==s.dataset.id).result=s.value;await sb.from("trades").update({result:s.value}).eq("id",s.dataset.id)});
  document.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{const t=S.trades.find(x=>x.id==b.dataset.id);if(!t||!confirm("Xoá lệnh "+t.pair+"? Không thể hoàn tác."))return;
   const r=await sb.from("trades").delete().eq("id",t.id);if(r.error)return alert("Lỗi: "+r.error.message);
   const ps=[t.h4_path,t.m15_path].filter(Boolean);if(ps.length)sb.storage.from("charts").remove(ps);S.trades=S.trades.filter(x=>x.id!==t.id);render()});
  document.querySelectorAll("img[data-p]").forEach(async i=>{const r=await sb.storage.from("charts").createSignedUrl(i.dataset.p,3600);if(r.data)i.src=r.data.signedUrl})}}
async function addTrade(){if(busy)return;const g=id=>$(id).value;
 const t={pair:g("#n-pair").toUpperCase()||"?",side:g("#n-side"),entry:+g("#n-e"),sl:+g("#n-sl"),tp:+g("#n-tp")||null,note:g("#n-note"),result:"open"};
 const su=S.setups.filter(x=>selS&&selS.has(String(x.id)));t.setup_ids=su.map(x=>x.id);
 if(!t.entry||!t.sl)return $("#n-out").innerHTML='<div class="alert yellow">Nhập tối thiểu Entry và SL.</div>';
 busy=true;$("#n-save").disabled=true;$("#n-out").innerHTML='<p class="mut">🤖 AI đang đối chiếu với setup chuẩn…</p>';
 try{const fs=[["h4",$("#n-h4").files[0]],["m15",$("#n-m15").files[0]]].filter(x=>x[1]),im=[];
  for(const[k,f]of fs){const c=await compress(f);im.push(c);const path=`${uid}/${Date.now()}-${k}.jpg`;
   const up=await sb.storage.from("charts").upload(path,c.blob,{contentType:"image/jpeg"});if(!up.error)t[k+"_path"]=path}
  try{t.ai=(await api({mode:"trade",images:im.map(({media_type,data})=>({media_type,data})),setups:su.map(x=>({name:x.name,body:x.body})),trade:t})).ai}
  catch(e){t.ai={verdict:"yellow",score:50,summary:"Không thể phân tích AI ("+e.message+"). Lệnh vẫn được lưu.",violations:[]}}
  const r=await sb.from("trades").insert(t).select().single();if(r.error)throw r.error;S.trades.push(r.data);$("#n-out").innerHTML=alertHTML(t.ai)
 }catch(e){$("#n-out").innerHTML=`<div class="alert red">Lỗi lưu lệnh: ${esc(e.message)}</div>`}
 busy=false;$("#n-save").disabled=false}
function renderRules(){
 if(!editId)editId=S.setups.length?String(S.setups[0].id):"new";
 const cur=S.setups.find(x=>String(x.id)===editId);
 $("#p-rules").innerHTML=`<div class="card"><h2>Các setup của bạn</h2><div>${S.setups.map(x=>`<button class="chip ${String(x.id)===editId?"on":""}" data-id="${x.id}">${esc(x.name)}</button>`).join("")}<button class="chip ${editId==="new"?"on":""}" data-id="new">+ Setup mới</button></div></div>
 <div class="card"><h2>${cur?"Sửa setup":"Tạo setup mới"}</h2><label>Tên setup</label><input id="s-name" placeholder="VD: Pullback EMA50, Breakout phiên London…">
 <p class="mut" style="margin-bottom:0">Nhập rule bằng văn bản, hoặc upload ảnh chart mẫu (H4, M15) để AI viết rule.</p>
 <div class="row"><div><label>Ảnh mẫu H4</label><input type="file" id="rh4" accept="image/*"></div><div><label>Ảnh mẫu M15</label><input type="file" id="rm15" accept="image/*"></div></div>
 <button class="sec" id="rgen" style="margin-top:10px">🤖 AI viết rule từ ảnh</button><label>Quy tắc (có thể chỉnh sửa)</label>
 <textarea id="rtxt" style="min-height:220px" placeholder="VD: H4 xu hướng tăng, chờ pullback về EMA50, M15 có nến đảo chiều, RR tối thiểu 1:2…"></textarea>
 <button class="pri" id="rsave">${cur?"Lưu thay đổi":"Tạo setup"}</button> ${cur?'<button class="sec" id="rdel" style="margin-top:12px">Xoá setup</button>':""} <span id="rmsg" class="mut"></span></div>`;
 $("#s-name").value=cur?.name||"";$("#rtxt").value=cur?.body||"";
 document.querySelectorAll(".chip[data-id]").forEach(b=>b.onclick=()=>{editId=b.dataset.id;renderRules()});
 $("#rsave").onclick=async()=>{const name=$("#s-name").value.trim(),body=$("#rtxt").value;if(!name)return $("#rmsg").textContent="Hãy đặt tên cho setup.";
  if(cur){const r=await sb.from("setups").update({name,body}).eq("id",cur.id);if(r.error)return $("#rmsg").textContent=r.error.message;cur.name=name;cur.body=body;renderRules();$("#rmsg").textContent="Đã lưu ✓"}
  else{const r=await sb.from("setups").insert({name,body}).select().single();if(r.error)return $("#rmsg").textContent=r.error.message;S.setups.push(r.data);editId=String(r.data.id);renderRules();$("#rmsg").textContent="Đã tạo ✓"}};

// BT-ENGINE-END
let btBars=null,btPlan=null,btRes=null,btRev=null,btBusy=false,btOpt={};
function btEquity(r){const e=r.eq;if(e.length<2)return"";const W=640,H=170,p=26,mn=Math.min(0,...e),mx=Math.max(0,...e),rg=(mx-mn)||1,X=i=>p+i*(W-2*p)/(e.length-1),Y=v=>H-p-(v-mn)/rg*(H-2*p);
 const cx=r.cutTrade>0&&r.cutTrade<e.length?X(r.cutTrade-1):null;
 return`<div class="overflow"><svg viewBox="0 0 ${W} ${H}" style="min-width:420px;width:100%"><line x1="${p}" x2="${W-p}" y1="${Y(0)}" y2="${Y(0)}" stroke="#2a2e39"/>
 <text x="0" y="${Y(0)+4}" fill="#787b86" font-size="10">0R</text><text x="0" y="${Y(mx)+4}" fill="#787b86" font-size="10">${mx.toFixed(0)}R</text>
 ${cx?`<line x1="${cx}" x2="${cx}" y1="${p-8}" y2="${H-p}" stroke="#f0b90b" stroke-dasharray="4"/><text x="${cx+4}" y="${p-2}" fill="#f0b90b" font-size="10">out-of-sample →</text>`:""}
 <polyline fill="none" stroke="${e[e.length-1]>=0?"#26a69a":"#ef5350"}" stroke-width="2" points="${e.map((v,i)=>X(i)+","+Y(v)).join(" ")}"/></svg></div>`}
function btShow(){const r=btRes,m=r.all,fx=(x,d=2)=>x==null||!isFinite(x)?"∞":x.toFixed(d),sg=x=>(x>0?"+":"")+fx(x);
 const warn=[];if(m.n<30)warn.push(`Chỉ có <b>${m.n}</b> lệnh – mẫu quá nhỏ, kết quả chưa đáng tin (nên có 100+ lệnh).`);
 if(r.is.n>=10&&r.oos.n>=5&&r.is.exp>0&&r.oos.exp<=0)warn.push("<b>Dấu hiệu overfitting:</b> phần dữ liệu đầu có lãi nhưng phần sau (out-of-sample) không còn lãi.");
 const row=(t,x)=>`<tr style="border-top:1px solid var(--line)"><td>${t}</td><td>${x.n}</td><td>${x.n?fx(x.wr,0)+"%":"–"}</td><td class="${x.exp>0?"up":x.exp<0?"dn":""}">${x.n?sg(x.exp):"–"}</td><td>${x.n?fx(x.pf):"–"}</td><td class="${x.tot>0?"up":x.tot<0?"dn":""}">${x.n?sg(x.tot):"–"}</td></tr>`;
 $("#bt-res").innerHTML=!m.n?'<div class="alert yellow">Không có lệnh nào được kích hoạt trên dữ liệu này. Kiểm tra lại quy tắc (điều kiện có quá khắt khe không?) hoặc dữ liệu.</div>':`
 <div class="card"><h2>Kết quả backtest</h2><p class="mut" style="font-size:12px">${r.bars.toLocaleString()} nến · ${esc(btBars[0].t)} → ${esc(btBars[btBars.length-1].t)} · pip ${btOpt.pip} · spread ${btOpt.spread} pip</p>
 <div class="grid"><div class="kpi"><small>Số lệnh</small><b>${m.n}</b></div><div class="kpi"><small>Win-rate</small><b>${fx(m.wr,0)}%</b></div>
 <div class="kpi"><small>Kỳ vọng (R/lệnh)</small><b class="${m.exp>0?"up":"dn"}">${sg(m.exp)}</b></div><div class="kpi"><small>Profit factor</small><b class="${m.pf>1?"up":"dn"}">${fx(m.pf)}</b></div>
 <div class="kpi"><small>Tổng R</small><b class="${m.tot>0?"up":"dn"}">${sg(m.tot)}</b></div><div class="kpi"><small>Drawdown tối đa</small><b class="dn">-${fx(m.dd,1)}R</b></div>
 <div class="kpi"><small>Thắng TB / Thua TB</small><b style="font-size:18px">${sg(m.avgW)} / ${fx(m.avgL)}</b></div><div class="kpi"><small>Chuỗi thua dài nhất</small><b>${m.streak}</b></div></div>
 ${warn.map(w=>`<div class="alert yellow" style="font-weight:400">⚠️ ${w}</div>`).join("")}</div>
 <div class="card"><h2>Đường vốn (R tích luỹ)</h2>${btEquity(r)}</div>
 <div class="card overflow"><h2>In-sample (70% đầu) vs Out-of-sample (30% sau)</h2><table style="width:100%;border-collapse:collapse;text-align:left;min-width:420px"><tr class="mut"><th></th><th>Lệnh</th><th>Win-rate</th><th>Kỳ vọng R</th><th>PF</th><th>Tổng R</th></tr>${row("In-sample",r.is)}${row("Out-of-sample",r.oos)}</table></div>
 <div class="card overflow"><h2>25 lệnh gần nhất</h2><table style="width:100%;border-collapse:collapse;text-align:left;min-width:520px"><tr class="mut"><th>Vào</th><th>Hướng</th><th>Entry</th><th>Exit</th><th>R</th><th>Lý do thoát</th></tr>${r.trades.slice(-25).reverse().map(t=>`<tr style="border-top:1px solid var(--line)"><td>${esc(t.t)}</td><td>${t.dir>0?"BUY":"SELL"}</td><td>${t.entry.toFixed(5)}</td><td>${t.exit.toFixed(5)}</td><td class="${t.r>0?"up":"dn"}">${sg(t.r)}</td><td>${esc(t.reason)}</td></tr>`).join("")}</table></div>
 <div class="card"><h2>🤖 Coach AI nhận xét kết quả</h2><button class="pri" id="bt-rev">Nhận xét backtest này</button><div id="bt-revout">${btRev?btRevHTML(btRev):""}</div></div>`;
 if(m.n)$("#bt-rev").onclick=btReview}
function btRevHTML(x){const r=x.review,V={promising:["✅ Có triển vọng","green"],needs_work:["⚠️ Cần cải thiện","yellow"],reject:["🚨 Chưa nên dùng","red"]}[r.verdict]||["⚠️ Cần cải thiện","yellow"];
 const L=(t,a)=>a?.length?`<h3 style="font-size:14px;margin:12px 0 4px">${t}</h3><ul style="margin:0;padding-left:18px">${a.map(i=>`<li style="margin:4px 0">${esc(i)}</li>`).join("")}</ul>`:"";
 return`<div class="alert ${V[1]}" style="margin-top:14px"><h3>${V[0]}</h3>${esc(r.summary)}${x.provider&&x.provider!=="gemini"?`<div class="mut" style="font-size:11px;font-weight:400">🔁 model dự phòng (${esc(x.provider)})</div>`:""}<div style="font-weight:400">${L("Điểm mạnh",r.strengths)}${L("Rủi ro / điểm cần lưu ý",r.risks)}${L("Đề xuất cải thiện",r.suggestions)}</div></div>`}
async function btReview(){if(btBusy)return;btBusy=true;$("#bt-rev").disabled=true;$("#bt-revout").innerHTML='<p class="mut">🤖 AI đang nhận xét…</p>';
 try{const cl=m=>m.n?{lenh:m.n,winrate_pct:+m.wr.toFixed(1),ky_vong_R:+m.exp.toFixed(3),profit_factor:isFinite(m.pf)?+m.pf.toFixed(2):null,tong_R:+m.tot.toFixed(1),max_dd_R:+m.dd.toFixed(1),chuoi_thua:m.streak,thang_tb_R:+m.avgW.toFixed(2),thua_tb_R:+m.avgL.toFixed(2)}:{lenh:0};
  btRev=await api({mode:"bt_review",payload:{rules_text:btPlan.rules_text,spec:btPlan.spec,unsupported:btPlan.unsupported_notes,assumptions:{...btOpt,so_nen:btRes.bars,tu:btBars[0].t,den:btBars[btBars.length-1].t},tong:cl(btRes.all),in_sample:cl(btRes.is),out_of_sample:cl(btRes.oos)}});
  $("#bt-revout").innerHTML=btRevHTML(btRev)}catch(e){$("#bt-revout").innerHTML=`<div class="alert red">Lỗi: ${esc(e.message)}</div>`}
 btBusy=false;$("#bt-rev").disabled=false}
function btExec(spec){try{const s=btValidate(spec);btPlan.spec=s;btRes=btRun(btBars,s,btOpt);btRev=null;btShow()}catch(e){$("#bt-res").innerHTML=`<div class="alert red">Lỗi quy tắc: ${esc(e.message)}</div>`}}
function btPlanHTML(){const p=btPlan;return`<div class="card"><h2>AI hiểu phương pháp: ${esc(p.name||"")}</h2><div style="white-space:pre-wrap">${esc(p.rules_text||"")}</div>
 ${p.unsupported_notes?.length?`<div class="alert yellow" style="font-weight:400"><b>Phần không thể backtest tự động (đã bỏ qua / làm gần đúng):</b><ul>${p.unsupported_notes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
 <details><summary class="mut" style="cursor:pointer">Quy tắc dạng JSON (có thể sửa rồi chạy lại)</summary><textarea id="bt-json" style="min-height:200px;font-family:monospace;font-size:12px">${esc(JSON.stringify(p.spec,null,1))}</textarea>
 <button class="sec" id="bt-rerun" style="margin-top:8px">Chạy lại với JSON đã sửa</button></details>
 <button class="sec" id="bt-save" style="margin-top:12px">💾 Lưu thành setup chuẩn</button> <span id="bt-smsg" class="mut"></span></div>`}
function renderBT(){
 if(!$("#p-bt").dataset.r){$("#p-bt").dataset.r=1;
  $("#p-bt").innerHTML=`<div class="card"><h2>Backtest phương pháp mới</h2><p class="mut">Mô tả phương pháp bằng chữ, upload dữ liệu giá (CSV) – AI chuyển thành quy tắc, hệ thống chạy backtest bằng thuật toán (AI không tự "đoán" kết quả).</p>
  <label>Lấy mô tả từ setup có sẵn (tuỳ chọn)</label><select id="bt-pre"></select>
  <label>Mô tả phương pháp giao dịch</label><textarea id="bt-desc" style="min-height:130px" placeholder="VD: Mua khi EMA20 cắt lên EMA50 và RSI14 > 50, SL = 1.5 ATR, TP = 2R. Bán ngược lại."></textarea>
  <label>Dữ liệu giá CSV (cột time, open, high, low, close – xuất từ MT4/MT5/TradingView)</label><input type="file" id="bt-file" accept=".csv,.txt">
  <div class="row"><div><label>Khung thời gian của dữ liệu</label><select id="bt-tf"><option>M5</option><option selected>M15</option><option>M30</option><option>H1</option><option>H4</option><option>D1</option></select></div>
  <div><label>Pip size (để trống = tự nhận)</label><input id="bt-pip" type="number" step="any" placeholder="0.0001 / 0.01"></div><div><label>Spread + phí (pip/lệnh)</label><input id="bt-spread" type="number" step="any" value="1"></div></div>
  <button class="pri" id="bt-run">Chuyển thành quy tắc & chạy backtest</button> <span id="bt-msg" class="mut"></span></div><div id="bt-plan"></div><div id="bt-res"></div>`;
  $("#bt-pre").onchange=e=>{const s=S.setups.find(x=>String(x.id)===e.target.value);if(s)$("#bt-desc").value=s.body};
  $("#bt-run").onclick=btStart}
 const v=$("#bt-pre").value;$("#bt-pre").innerHTML='<option value="">— Không chọn —</option>'+S.setups.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");$("#bt-pre").value=v}
async function btStart(){if(btBusy)return;const msg=t=>$("#bt-msg").textContent=t,desc=$("#bt-desc").value.trim(),f=$("#bt-file").files[0];
 if(!desc)return msg("Hãy mô tả phương pháp.");if(!f)return msg("Hãy chọn file CSV dữ liệu giá.");
 btBusy=true;$("#bt-run").disabled=true;$("#bt-plan").innerHTML="";$("#bt-res").innerHTML="";
 try{msg("Đang đọc dữ liệu…");let bars=parseCSV(await f.text());let note="";if(bars.length>150000){bars=bars.slice(-150000);note=" (chỉ dùng 150.000 nến gần nhất)"}
  btBars=bars;const pip=+$("#bt-pip").value||(bars[bars.length-1].close>30?0.01:0.0001);btOpt={pip,spread:Math.max(0,+$("#bt-spread").value||0),tf:$("#bt-tf").value};
  msg("AI đang chuyển phương pháp thành quy tắc…"+note);
  const r=await api({mode:"strategy",description:desc,tf:btOpt.tf});btPlan=r.plan;btPlan.provider=r.provider;
  if(!btPlan.supported){$("#bt-plan").innerHTML=`<div class="alert yellow"><b>Phương pháp này chưa thể backtest tự động.</b><br>${esc(btPlan.reason||"")}${btPlan.unsupported_notes?.length?`<ul>${btPlan.unsupported_notes.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}<div style="font-weight:400;margin-top:6px">Gợi ý: mô tả lại bằng điều kiện đo được (chỉ báo, mức giá, cắt nhau, phá đỉnh/đáy N nến…).</div></div>`;msg("");btBusy=false;$("#bt-run").disabled=false;return}
  $("#bt-plan").innerHTML=btPlanHTML();
  $("#bt-rerun").onclick=()=>{try{btPlan.spec=JSON.parse($("#bt-json").value)}catch(e){return $("#bt-res").innerHTML='<div class="alert red">JSON không hợp lệ: '+esc(e.message)+"</div>"}btExec(btPlan.spec)};
  $("#bt-save").onclick=async()=>{const r=await sb.from("setups").insert({name:btPlan.name||"Setup từ backtest",body:btPlan.rules_text||desc}).select().single();if(r.error)return $("#bt-smsg").textContent=r.error.message;S.setups.push(r.data);$("#bt-smsg").textContent="Đã lưu vào tab Setup chuẩn ✓"};
  msg("Đang chạy backtest…");await new Promise(x=>setTimeout(x,30));btExec(btPlan.spec);msg("")}
 catch(e){msg("Lỗi: "+e.message)}
 btBusy=false;$("#bt-run").disabled=false}
boot().catch(e=>{$("#who").textContent="Chưa cấu hình biến môi trường Supabase"});
</script></body></html>
