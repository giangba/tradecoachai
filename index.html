<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeCoach AI – Nhật ký giao dịch</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#131722;--card:#1e222d;--line:#2a2e39;--tx:#d1d4dc;--mut:#787b86;--up:#26a69a;--dn:#ef5350;--warn:#f0b90b;--acc:#2962ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);gap:8px}
h1{font-size:16px;margin:0}h1 b{color:var(--acc)}h2{font-size:15px;margin:0 0 10px}
nav{display:flex;gap:4px;padding:8px 16px;overflow-x:auto}
nav button{background:none;border:0;color:var(--mut);padding:8px 14px;border-radius:6px;cursor:pointer;font-size:14px;white-space:nowrap}
nav button.on{background:var(--acc);color:#fff}
main{padding:0 16px 40px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi small{color:var(--mut);display:block}.kpi b{font-size:26px}
.up{color:var(--up)}.dn{color:var(--dn)}.wn{color:var(--warn)}
label{display:block;color:var(--mut);font-size:12px;margin:8px 0 3px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:8px;border-radius:6px;font:inherit}
textarea{min-height:90px;resize:vertical}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
button.pri{background:var(--acc);color:#fff;border:0;padding:10px 18px;border-radius:6px;cursor:pointer;font-weight:600;margin-top:12px}
button.pri:disabled{opacity:.5}button.sec{background:var(--line);color:var(--tx);border:0;padding:8px 12px;border-radius:6px;cursor:pointer}
.alert{border-radius:8px;padding:12px 14px;margin:12px 0;border:2px solid;font-weight:500}
.alert.green{background:#26a69a22;border-color:var(--up)}.alert.red{background:#ef535026;border-color:var(--dn)}.alert.yellow{background:#f0b90b1f;border-color:var(--warn)}
.alert h3{margin:0 0 4px;font-size:16px}.alert ul{margin:6px 0 0;padding-left:18px;font-weight:400}
.trade{border-left:4px solid var(--line)}.trade.green{border-color:var(--up)}.trade.red{border-color:var(--dn)}.trade.yellow{border-color:var(--warn)}
.mut{color:var(--mut)}.hide{display:none}.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--dn)}
.overflow{overflow-x:auto}.imgs img{max-width:48%;border-radius:6px;border:1px solid var(--line);margin:4px 1% 0 0}
#auth{max-width:380px;margin:60px auto}
</style></head><body>
<header><h1>📈 Trade<b>Coach</b> AI</h1><span><span class="mut" id="who"></span> <button class="sec hide" id="out">Đăng xuất</button></span></header>
<main id="auth" class="hide"><div class="card"><h2>Đăng nhập / Đăng ký</h2>
<label>Email</label><input id="a-mail" type="email"><label>Mật khẩu (≥6 ký tự)</label><input id="a-pw" type="password">
<button class="pri" id="a-in">Đăng nhập</button> <button class="sec" id="a-up">Đăng ký</button><p id="a-msg" class="mut"></p></div></main>
<div id="app" class="hide"><nav id="nav"></nav><main>
<section id="p-dash"></section><section id="p-rules" class="hide"></section><section id="p-new" class="hide"></section><section id="p-log" class="hide"></section></main></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tok,sb,S={rules:"",trades:[]},uid,tab="dash",busy=false;
const tabs={dash:"Dashboard",rules:"Setup chuẩn",new:"+ Lệnh mới",log:"Nhật ký"};
$("#nav").innerHTML=Object.entries(tabs).map(([k,v])=>`<button data-k="${k}">${v}</button>`).join("");
$("#nav").onclick=e=>{if(e.target.dataset.k)show(e.target.dataset.k)};
function show(k){tab=k;for(const t in tabs)$("#p-"+t).classList.toggle("hide",t!==k);
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));render()}
async function token(){return tok||(await sb.auth.getSession()).data.session?.access_token}
async function api(body){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),75000);
 try{const r=await fetch("/api/analyze",{method:"POST",signal:ac.signal,headers:{"content-type":"application/json",Authorization:"Bearer "+await token()},body:JSON.stringify(body)});
 const raw=await r.text();let j;try{j=JSON.parse(raw)}catch(e){throw new Error("Server trả lỗi "+r.status+": "+raw.slice(0,120))}
 if(!r.ok)throw new Error(j.error||"Lỗi server "+r.status);return j}
 catch(e){throw new Error(e.name==="AbortError"?"Quá thời gian chờ (75s). Thử lại hoặc dùng ảnh nhỏ hơn.":e.message)}finally{clearTimeout(tm)}}
function compress(file){return new Promise((ok,no)=>{const t=setTimeout(()=>no(new Error("Không đọc được ảnh (thử PNG/JPG)")),15000);
 const im=new Image();im.onload=()=>{try{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");
 c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);
 c.toBlob(bl=>{if(!bl){clearTimeout(t);return no(new Error("Không nén được ảnh"))}const f=new FileReader();
 f.onload=()=>{clearTimeout(t);ok({blob:bl,media_type:"image/jpeg",data:f.result.split(",")[1]})};f.onerror=()=>no(new Error("Lỗi đọc ảnh"));f.readAsDataURL(bl)},"image/jpeg",.82)}catch(e){clearTimeout(t);no(e)}};
 im.onerror=()=>{clearTimeout(t);no(new Error("Định dạng ảnh không được hỗ trợ (HEIC/WEBP lạ?). Hãy dùng PNG/JPG"))};im.src=URL.createObjectURL(file)})}
async function boot(){
 const c=await (await fetch("/api/config")).json();sb=supabase.createClient(c.url,c.key);
 sb.auth.onAuthStateChange((_e,s)=>{setTimeout(()=>enter(s),0)});enter((await sb.auth.getSession()).data.session)}
async function enter(s){tok=s?.access_token;const on=!!s;$("#auth").classList.toggle("hide",on);$("#app").classList.toggle("hide",!on);$("#out").classList.toggle("hide",!on);
 if(!on){uid=null;$("#who").textContent="";return}
 if(uid===s.user.id)return;uid=s.user.id;$("#who").textContent=s.user.email;
 const r=await sb.from("rules").select("body").maybeSingle();S.rules=r.data?.body||"";
 const t=await sb.from("trades").select("*").order("created_at");S.trades=t.data||[];
 ["rules","new"].forEach(k=>delete $("#p-"+k).dataset.r);show("dash")}
$("#a-in").onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$("#a-mail").value,password:$("#a-pw").value});if(r.error)$("#a-msg").textContent=r.error.message};
$("#a-up").onclick=async()=>{const r=await sb.auth.signUp({email:$("#a-mail").value,password:$("#a-pw").value});$("#a-msg").textContent=r.error?r.error.message:(r.data.session?"":"Kiểm tra email để xác nhận tài khoản.")};
$("#out").onclick=()=>sb.auth.signOut();
function stats(){const t=S.trades,done=t.filter(x=>x.result==="win"||x.result==="loss"),w=done.filter(x=>x.result==="win").length;
 const sc=t.filter(x=>x.ai&&typeof x.ai.score==="number"),avg=sc.length?Math.round(sc.reduce((a,x)=>a+x.ai.score,0)/sc.length):null;
 const comp=sc.filter(x=>x.ai.verdict==="green").length,tags={};t.forEach(x=>(x.ai?.violations||[]).forEach(v=>{const k=v.slice(0,60);tags[k]=(tags[k]||0)+1}));
 return{n:t.length,wr:done.length?Math.round(w/done.length*100):null,avg,comp:sc.length?Math.round(comp/sc.length*100):null,sc,tags}}
function chart(sc){if(sc.length<2)return'<p class="mut">Cần ít nhất 2 lệnh đã phân tích để vẽ biểu đồ.</p>';
 const W=640,H=160,p=24,pts=sc.map((x,i)=>[p+i*(W-2*p)/(sc.length-1),H-p-(x.ai.score/100)*(H-2*p),x.ai.verdict]),col={green:"#26a69a",red:"#ef5350",yellow:"#f0b90b"};
 return`<div class="overflow"><svg viewBox="0 0 ${W} ${H}" style="min-width:420px;width:100%">${[0,50,100].map(v=>{const y=H-p-v/100*(H-2*p);return`<line x1="${p}" x2="${W-p}" y1="${y}" y2="${y}" stroke="#2a2e39"/><text x="0" y="${y+4}" fill="#787b86" font-size="10">${v}</text>`}).join("")}
 <polyline fill="none" stroke="#2962ff" stroke-width="2" points="${pts.map(a=>a[0]+","+a[1]).join(" ")}"/>${pts.map(a=>`<circle cx="${a[0]}" cy="${a[1]}" r="5" fill="${col[a[2]]||"#888"}"/>`).join("")}</svg></div>`}
function alertHTML(a){if(!a)return'<div class="alert yellow">Chưa có phân tích AI.</div>';
 const m={green:["✅ TUÂN THỦ SETUP","green"],red:["🚨 CẢNH BÁO ĐỎ – VI PHẠM KỶ LUẬT","red"],yellow:["⚠️ CẦN LƯU Ý","yellow"]}[a.verdict]||["⚠️ CẦN LƯU Ý","yellow"];
 return`<div class="alert ${m[1]}"><h3>${m[0]} · ${esc(a.score)}/100${a.fomo?" · FOMO":""}</h3>${esc(a.summary)}${a.violations?.length?`<ul>${a.violations.map(v=>`<li>${esc(v)}</li>`).join("")}</ul>`:""}</div>`}
function render(){
 if(tab==="dash"){const s=stats();$("#p-dash").innerHTML=`<div class="grid" style="margin-bottom:14px">
  <div class="card kpi"><small>Tổng số lệnh</small><b>${s.n}</b></div>
  <div class="card kpi"><small>Win-rate</small><b class="${s.wr>=50?"up":"dn"}">${s.wr??"–"}${s.wr!=null?"%":""}</b></div>
  <div class="card kpi"><small>Discipline Score TB</small><b class="${s.avg>=70?"up":s.avg>=40?"wn":"dn"}">${s.avg??"–"}</b></div>
  <div class="card kpi"><small>Lệnh tuân thủ</small><b class="up">${s.comp??"–"}${s.comp!=null?"%":""}</b></div></div>
  <div class="card"><h2>Discipline Score theo thời gian</h2>${chart(s.sc)}</div>
  <div class="card"><h2>Lỗi thường gặp</h2>${Object.keys(s.tags).length?Object.entries(s.tags).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>`<div style="margin:8px 0">${esc(k)} <span class="mut">×${v}</span><div class="bar"><i style="width:${v/Math.max(...Object.values(s.tags))*100}%"></i></div></div>`).join(""):'<p class="mut">Chưa có vi phạm nào.</p>'}</div>`}
 if(tab==="rules"&&!$("#p-rules").dataset.r){$("#p-rules").dataset.r=1;
  $("#p-rules").innerHTML=`<div class="card"><h2>Setup chuẩn của bạn</h2><p class="mut">Nhập rule bằng văn bản, hoặc upload ảnh chart mẫu (H4, M15) để AI viết rule.</p>
  <div class="row"><div><label>Ảnh mẫu H4</label><input type="file" id="rh4" accept="image/*"></div><div><label>Ảnh mẫu M15</label><input type="file" id="rm15" accept="image/*"></div></div>
  <button class="sec" id="rgen" style="margin-top:10px">🤖 AI viết rule từ ảnh</button><label>Quy tắc (có thể chỉnh sửa)</label>
  <textarea id="rtxt" style="min-height:220px" placeholder="VD: H4 xu hướng tăng, chờ pullback về EMA50, M15 có nến đảo chiều, RR tối thiểu 1:2…"></textarea>
  <button class="pri" id="rsave">Lưu quy tắc</button> <span id="rmsg" class="mut"></span></div>`;
  $("#rtxt").value=S.rules;
  $("#rsave").onclick=async()=>{S.rules=$("#rtxt").value;const r=await sb.from("rules").upsert({user_id:uid,body:S.rules,updated_at:new Date()});$("#rmsg").textContent=r.error?r.error.message:"Đã lưu ✓"};
  $("#rgen").onclick=async()=>{const f=[$("#rh4").files[0],$("#rm15").files[0]].filter(Boolean);if(!f.length)return $("#rmsg").textContent="Hãy chọn ít nhất một ảnh.";
   $("#rmsg").textContent="AI đang phân tích…";try{const im=await Promise.all(f.map(compress));const r=await api({mode:"rules",images:im.map(({media_type,data})=>({media_type,data}))});
   $("#rtxt").value=r.text;$("#rmsg").textContent="Xem lại rồi bấm Lưu."}catch(e){$("#rmsg").textContent="Lỗi: "+e.message}}}
 if(tab==="new"&&!$("#p-new").dataset.r){$("#p-new").dataset.r=1;
  $("#p-new").innerHTML=`<div class="card"><h2>Thêm lệnh mới</h2><div class="row"><div><label>Cặp tiền</label><input id="n-pair" placeholder="EURUSD"></div>
  <div><label>Hướng</label><select id="n-side"><option>BUY</option><option>SELL</option></select></div><div><label>Entry</label><input id="n-e" type="number" step="any"></div>
  <div><label>SL</label><input id="n-sl" type="number" step="any"></div><div><label>TP</label><input id="n-tp" type="number" step="any"></div></div>
  <div class="row"><div><label>Ảnh chart H4</label><input type="file" id="n-h4" accept="image/*"></div><div><label>Ảnh chart M15</label><input type="file" id="n-m15" accept="image/*"></div></div>
  <label>Ghi chú lý do vào lệnh</label><textarea id="n-note" placeholder="Vì sao bạn vào lệnh này?"></textarea>
  <button class="pri" id="n-save">Lưu lệnh & nhờ AI kiểm tra kỷ luật</button><div id="n-out"></div></div>`;$("#n-save").onclick=addTrade}
 if(tab==="log"){$("#p-log").innerHTML=S.trades.length?[...S.trades].reverse().map(t=>{const rr=t.sl&&t.entry&&t.tp?(Math.abs(t.tp-t.entry)/Math.abs(t.entry-t.sl)).toFixed(2):"–";
  return`<div class="card trade ${t.ai?.verdict||""}"><b>${esc(t.pair)} · ${esc(t.side)}</b> <span class="mut">${new Date(t.created_at).toLocaleString("vi-VN")}</span>
  <div class="mut">Entry ${esc(t.entry)} · SL ${esc(t.sl)} · TP ${esc(t.tp)} · RR ${rr}</div><p>${esc(t.note)}</p>
  <div class="imgs">${[t.h4_path,t.m15_path].filter(Boolean).map(p=>`<img data-p="${esc(p)}" alt="chart">`).join("")}</div>${alertHTML(t.ai)}
  <label>Kết quả</label><select data-id="${t.id}" class="res" style="max-width:160px">${[["open","Đang mở"],["win","Thắng"],["loss","Thua"]].map(([v,l])=>`<option value="${v}" ${t.result===v?"selected":""}>${l}</option>`).join("")}</select></div>`}).join(""):'<div class="card mut">Chưa có lệnh nào.</div>';
  document.querySelectorAll(".res").forEach(s=>s.onchange=async()=>{S.trades.find(t=>t.id==s.dataset.id).result=s.value;await sb.from("trades").update({result:s.value}).eq("id",s.dataset.id)});
  document.querySelectorAll("img[data-p]").forEach(async i=>{const r=await sb.storage.from("charts").createSignedUrl(i.dataset.p,3600);if(r.data)i.src=r.data.signedUrl})}}
async function addTrade(){if(busy)return;const g=id=>$(id).value;
 const t={pair:g("#n-pair").toUpperCase()||"?",side:g("#n-side"),entry:+g("#n-e"),sl:+g("#n-sl"),tp:+g("#n-tp")||null,note:g("#n-note"),result:"open"};
 if(!t.entry||!t.sl)return $("#n-out").innerHTML='<div class="alert yellow">Nhập tối thiểu Entry và SL.</div>';
 busy=true;$("#n-save").disabled=true;$("#n-out").innerHTML='<p class="mut">🤖 AI đang đối chiếu với setup chuẩn…</p>';
 try{const fs=[["h4",$("#n-h4").files[0]],["m15",$("#n-m15").files[0]]].filter(x=>x[1]),im=[];
  for(const[k,f]of fs){const c=await compress(f);im.push(c);const path=`${uid}/${Date.now()}-${k}.jpg`;
   const up=await sb.storage.from("charts").upload(path,c.blob,{contentType:"image/jpeg"});if(!up.error)t[k+"_path"]=path}
  try{t.ai=(await api({mode:"trade",images:im.map(({media_type,data})=>({media_type,data})),rules:S.rules,trade:t})).ai}
  catch(e){t.ai={verdict:"yellow",score:50,summary:"Không thể phân tích AI ("+e.message+"). Lệnh vẫn được lưu.",violations:[]}}
  const r=await sb.from("trades").insert(t).select().single();if(r.error)throw r.error;S.trades.push(r.data);$("#n-out").innerHTML=alertHTML(t.ai)
 }catch(e){$("#n-out").innerHTML=`<div class="alert red">Lỗi lưu lệnh: ${esc(e.message)}</div>`}
 busy=false;$("#n-save").disabled=false}
boot().catch(e=>{$("#who").textContent="Chưa cấu hình biến môi trường Supabase"});
</script></body></html>
